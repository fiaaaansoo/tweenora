<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/common.css">
<title>Files with scripts</title>
</head>
<body>
<canvas id="canvas" class="fill"></canvas>
<script src="/pkg/rive.js"></script>
<script src="/common.js"></script>
<script>
  var ex = twnoExample;
  rive.Rive.suppressDeprecationWarnings = Object.values(rive.DeprecationKeys);

  ex.start(function () {
    var instance = new rive.Rive({
      src: ex.file,
      canvas: document.getElementById("canvas"),
      artboard: ex.params.get("artboard") || undefined,
      stateMachine: ex.params.get("stateMachine") || "State Machine 1",
      autoplay: true,
      autoBind: true,
      onLoad: function () {
        instance.resizeDrawingSurfaceToCanvas();
        ex.setState("loaded", "loaded");
      },
      onLoadError: ex.fail,
      onAdvance: ex.countFrames,
    });

    function property(kind, path) { return instance.viewModelInstance[kind](path); }

    twnoCheck.instance = instance;
    twnoCheck.properties = function () {
      return instance.viewModelInstance.properties.map(function (entry) {
        return entry.name + ":" + entry.type;
      });
    };
    twnoCheck.set = function (kind, path, value) {
      var target = property(kind, path);
      target.value = value;
      return target.value;
    };
    twnoCheck.trigger = function (path) { property("trigger", path).trigger(); };
  });
</script>
</body>
</html>
