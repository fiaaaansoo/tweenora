<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Tweenora, package check</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="rive.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var fileUrl = params.get("file");
  var baseTitle = document.title;
  window.twnoCheck = { state: "loading", error: null, frames: 0 };

  function setState(state, text) {
    window.twnoCheck.state = state;
    document.title = baseTitle + ": " + (text || state);
  }

  if (!fileUrl) {
    setState("error", "missing ?file=<url> parameter");
  } else {
    rive.RuntimeLoader.setWasmUrl("rive.wasm");
    rive.RuntimeLoader.setWasmFallbackUrl("rive_fallback.wasm");
    var canvas = document.getElementById("canvas");
    var instance = new rive.Rive({
      src: fileUrl,
      canvas: canvas,
      autoplay: true,
      onLoad: function () {
        instance.resizeDrawingSurfaceToCanvas();
        setState("loaded", "loaded " + fileUrl);
      },
      onLoadError: function (event) {
        window.twnoCheck.error = String(event && event.data ? event.data : event);
        setState("error", window.twnoCheck.error);
      },
      onAdvance: function () {
        window.twnoCheck.frames += 1;
        if (window.twnoCheck.state === "loaded") { setState("drawing", "drawing " + fileUrl); }
      },
    });
    window.twnoCheck.instance = instance;
  }
</script>
</body>
</html>
